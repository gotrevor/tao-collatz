name: Comparator

# Machine-checked STATEMENT-level trust, independent of this repo's own build.
#
# The project's own axiom gate (`#print axioms` on the headlines) certifies the *proofs*, but it
# runs inside our own Lean environment — it trusts our elaborator, our oleans, and any
# macro/tactic/set_option in the project. comparator certifies the *statements*, from outside:
#
#   1. Each Comparator/<Result>/Challenge.lean imports ONLY Mathlib and declares the trusted
#      vocabulary + anchors. That file is the entire human audit surface.
#   2. Solution.lean discharges the named theorems from the real development.
#   3. comparator exports both environments (it deliberately does NOT load our oleans), checks that
#      every declaration used in a challenge statement is IDENTICAL in the solution, replays the
#      proofs through the Lean kernel AND the independent `nanoda` kernel, and enforces the
#      permitted-axiom whitelist.
#
# The solution build runs under `landrun` (Linux Landlock sandbox), so a solution that tried to
# rewrite the challenge's oleans mid-elaboration could not. That protects a *stranger* checking this
# repo without trusting us — which is the point.
#
# tao-collatz is COMPLETE (2026-07-15): both headlines - Tao's Thm 1.3 (`tao_collatz`) and the
# Thm 3.1 Colmin form (`tao_collatz_quantitative`) - are discharged and joined the challenge, so
# this harness certifies them alongside the trusted VOCABULARY (col/colMin/log-density defs) and
# the non-vacuity anchors. See Comparator/TaoCollatz/Challenge.lean.
#
# Linux-only by construction (landrun needs Landlock). No local/macOS path — for a local pre-flight
# of the statement-identity check, run `scripts/comparator-probe`.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-26.04
    env:
      # lean4export MUST match the Lean version of THIS project's oleans, or it refuses them with
      # "incompatible header". Keep in lockstep with lean-toolchain -- BUT lean4export only tags
      # x.y.0 releases (no v4.33.1 tag exists), so this is the nearest existing SOURCE ref; the
      # build step below overwrites its lean-toolchain with THIS repo's, so the binary is built on
      # our exact toolchain and accepts our oleans. The cache key hashes our lean-toolchain, so a
      # patch-version bump still rotates the cache even when this tag does not change.
      LEAN4EXPORT_TAG: v4.33.0
      # The other three verifier components ship no usable release tags (landrun's tags stop at
      # v0.1.9 while it reports 0.1.15), so they are pinned by SHA. They used to be cloned from
      # `main`, which combined with the cache below was worse than merely irreproducible -- it was
      # actively MISLEADING. The cache key did not mention them, so once it was warm the whole
      # "Build landrun, lean4export, nanoda, comparator" step was SKIPPED on every run: this job
      # reported green while replaying binaries frozen at whatever `main` happened to be the day
      # the key was first populated. It was verifying nothing new about the toolchain.
      #
      # It surfaced in lean-gallery when its v4.31 -> v4.32 bump changed LEAN4EXPORT_TAG, rotating
      # the key and forcing a real rebuild -- which picked up, in one go, every upstream commit
      # since. landrun had merged its long-pending urfave/cli v2 -> v3 migration hours earlier
      # (PR #50); v3 consumes the bare `--` terminator, so comparator's
      # `lean4export <module> -- <constants...>` arrived as `lean4export <module> <constants...>`
      # and lean4export died trying to import a module named `Nat`. Hence the landrun pin is the
      # last commit BEFORE that migration.
      #
      # Every pin is in the cache key, so changing one rotates the cache automatically and the
      # rebuild actually runs. Bump these deliberately, and expect to re-verify when you do.
      LANDRUN_REV: 5e9a0d15d6009cdaf27133bf2d59d29e7018cc47
      NANODA_REV: f58f2f6d535e189a40fcb02ede8eb95f97a92d37
      COMPARATOR_REV: 68a064109f01c08f47c8edc9f51d6a2bbffaa188
    steps:
      - uses: actions/checkout@v7

      # elan/lake MUST come first: the verifier build below compiles lean4export and comparator,
      # which are Lean projects on their own toolchains. `build: false` — we drive our build below.
      - uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Cache verifier binaries
        id: cache-bins
        uses: actions/cache@v6
        with:
          path: ~/verifier-bin
          # Every pinned rev is in the key: bumping any pin rotates the cache and the rebuild
          # below actually runs, instead of the pin being a comment that changes nothing.
          key: verifier-bin-${{ runner.os }}-${{ env.LEAN4EXPORT_TAG }}-${{ hashFiles('lean-toolchain') }}-${{ env.LANDRUN_REV }}-${{ env.NANODA_REV }}-${{ env.COMPARATOR_REV }}

      - name: Build landrun, lean4export, nanoda, comparator
        if: steps.cache-bins.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/verifier-bin ~/verifier-src && cd ~/verifier-src

          # landrun — Landlock sandbox. Pinned to the last commit on urfave/cli v2; see the
          # LANDRUN_REV note above for why v3 breaks comparator's lean4export invocation.
          git clone https://github.com/Zouuup/landrun.git
          (cd landrun && git checkout "$LANDRUN_REV" && go build -o ~/verifier-bin/landrun ./cmd/landrun)

          # nanoda — the INDEPENDENT kernel: trust weakens from "Lean's kernel is correct" to
          # "Lean's kernel OR nanoda is correct".
          git clone https://github.com/ammkrn/nanoda_lib.git
          (cd nanoda_lib && git checkout "$NANODA_REV" && cargo build --release \
             && cp target/release/nanoda_bin ~/verifier-bin/)

          # lean4export — sources from the nearest existing tag, BUILT ON OUR TOOLCHAIN (see the
          # LEAN4EXPORT_TAG note above): the toolchain overwrite is what makes its binary accept
          # this repo's oleans when our patch version has no lean4export tag of its own.
          git clone https://github.com/leanprover/lean4export.git
          (cd lean4export && git checkout "$LEAN4EXPORT_TAG" \
             && cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain && lake build \
             && cp .lake/build/bin/lean4export ~/verifier-bin/)

          # comparator itself (builds on its own toolchain; elan fetches it).
          git clone https://github.com/leanprover/comparator.git
          (cd comparator && git checkout "$COMPARATOR_REV" && lake build comparator \
             && cp .lake/build/bin/comparator ~/verifier-bin/)

      - name: Build project + comparator modules
        run: |
          lake exe cache get
          lake build TaoCollatz
          lake build Comparator

      - name: Verify every result under comparator (Lean kernel + nanoda)
        run: |
          set -uo pipefail
          export PATH="$HOME/verifier-bin:$PATH"
          fail=0
          shopt -s nullglob
          configs=(Comparator/*/config.json)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "::error::no comparator configs found — the gate would pass vacuously"; exit 1
          fi
          echo "### 🔍 Comparator: statement-level verification" >> "$GITHUB_STEP_SUMMARY"
          for cfg in "${configs[@]}"; do
            name=$(basename "$(dirname "$cfg")")
            echo "::group::comparator — $name"
            if lake env comparator "$cfg"; then
              echo "::notice::comparator OK — $name"
              echo "- ✅ \`$name\` — challenge statements proved, both kernels accept" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::comparator FAILED — $name"
              echo "- ❌ \`$name\` — FAILED" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
